<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img"><rect width="1080" height="600" fill="#e9ece2"/><rect x="30" y="30" width="1020" height="540" rx="12" fill="#faf9f4" stroke="#a9b8a9"/><style>.head{font:bold 21px Arial,sans-serif;fill:#293b33}.small{font:bold 14px Arial,sans-serif;fill:#678373;letter-spacing:1px}.label{font:19px Arial,sans-serif;fill:#293b33}.desc{font:14px Arial,sans-serif;fill:#586c5c}.cell{fill:#f0f3ec;stroke:#a4b4a5;stroke-width:2}.strong{fill:#dfeae0;stroke:#7c9c83;stroke-width:2}</style><text class="small" x="70" y="97">CROSS-COMPANY CAPABILITY / NOT ONE SHARED SYSTEM</text><text class="head" x="70" y="137">Connected-device product management across four employers.</text><rect x="76" y="203" width="440" height="109" rx="12" class="cell"/><text class="label" x="95" y="240">Phoenix Robotix</text><text class="desc" x="95" y="268">Field BLE &amp; connectivity</text><rect x="560" y="203" width="440" height="109" rx="12" class="strong"/><text class="label" x="579" y="240">Ambee</text><text class="desc" x="579" y="268">1,200+ devices · MQTT · OTA</text><rect x="76" y="350" width="440" height="109" rx="12" class="cell"/><text class="label" x="95" y="387">Smart Joules</text><text class="desc" x="95" y="415">Grafana · fleet firmware</text><rect x="560" y="350" width="440" height="109" rx="12" class="strong"/><text class="label" x="579" y="387">RingCentral</text><text class="desc" x="579" y="415">SIP/DECT · provisioning</text><text class="desc" x="70" y="525">Four separate product scopes; conceptual workflow rather than an architecture diagram</text></svg>